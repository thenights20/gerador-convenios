name: Integrar histórico CRM

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_crm_historico.py'
      - '.github/workflows/patch-crm-historico.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar integração
        run: python3 scripts/patch_crm_historico.py
      - name: Validar
        run: |
          grep -q 'CRM_CONVENIO_GERADO' app.js
          grep -q 'app.js?v=20260831-02' index.html
      - name: Salvar
        shell: bash
        run: |
          if ! git diff --quiet -- app.js index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.js index.html
            git commit -m "Integra gerador ao histórico de convênios do CRM"
            git push
          fi